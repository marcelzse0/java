<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Smagieł-Marcel-Zadanie48</title>
</head>
<body>
<div style="color:blue;font-size:20px;">
    <script language="JavaScript">
        var suma_sma = 0;
        var i_sma = 1;

        while (i_sma <= 1000000) {
            suma_sma += 1 / i_sma;
            i_sma++;
        }

        document.write("Suma szeregu harmonicznego od 1 do 1 000 000 = "+suma_sma+"<br>");
    </script>
</div>
<input type="button" value="zamknij okno" onclick="window.close()"/>
</body>
</html>
